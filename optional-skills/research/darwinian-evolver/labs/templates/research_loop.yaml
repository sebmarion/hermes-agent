# Research loop for the bounded Hermes-skill research pilot.
# This is a description contract, not executable state. It documents the exact
# phases the runbook (RUNBOOK.md) must walk, so two reviewers can agree on the
# sequence without re-deriving it.

schema_version: 1
run_id: ""            # filled per-run; never in git
primary_agent: "zeus/qwen3.8-27b"   # the only agent allowed to propose candidates
independent_reviewer: ""            # MUST resolve to a non-Zeus model at runtime

phases:
  - name: harvest
    description: >
      Primary (Zeus) searches real Hermes session evidence via session_search for
      completed tasks touching skill_path. Produces before_session_ids and the
      candidate patch proposal only. No verdicts here.
    outputs: [candidate_patch, before_session_ids]

  - name: candidate_patch
    description: >
      The proposed edit to the target SKILL.md is written as a unified diff with
      a stable sha256 (candidate_patch_sha256). It is never applied outside the
      isolated worktree.
    outputs: [candidate_patch, candidate_patch_sha256]

  - name: blind_ab
    description: >
      Harness assigns blind_id A/B and sends ONLY the anonymized diff + frozen
      judge prompt to the non-Zeus reviewer via delegate_task(mode="review").
      The primary never sees the raw before/after transcripts.
    outputs: [judges.jsonl, judge_prompt_hash]

  - name: independent_review
    description: >
      A second, independent review (separate from blind_ab) confirms the diff
      is safe and in scope. GitNexus risk review covers affected symbols.
      No promotion decision happens in this file — see RUNBOOK.md gates.
    outputs: [review_notes]

# Gates are enforced by scripts + runbook, not by this YAML. A blank template
# with empty strings must be rejected at run start until every required field is
# filled and validated.
